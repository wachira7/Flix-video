name: Backfill plan grants

# One-off, run by hand from the Actions tab. Gives a plan to people who
# paid before payments granted plans automatically. Dry run by default.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the grants (leave false for a dry run)'
        type: boolean
        default: false

jobs:
  backfill:
    name: Backfill plan grants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: cd backend && yarn install --frozen-lockfile

      - name: Backfill
        run: cd backend && node scripts/backfill-plan-grants.js ${{ inputs.apply && '--apply' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
